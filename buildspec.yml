version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: audittrail-ai
    AWS_ACCOUNT_ID: "404107359700"

phases:
  pre_build:
    commands:
      - |
        REGISTRY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" >/dev/null
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY_URI"
  build:
    commands:
      - |
        IMAGE_TAG="$(printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c 1-12)"
        IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
        docker build --pull --tag "$IMAGE_URI" .
  post_build:
    commands:
      - |
        IMAGE_TAG="$(printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c 1-12)"
        IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
        REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
        docker push "$IMAGE_URI"
        docker tag "$IMAGE_URI" "${REPOSITORY_URI}:latest"
        docker push "${REPOSITORY_URI}:latest"
      - |
        if [ -n "${ECS_CLUSTER_NAME:-}" ] && [ -n "${ECS_SERVICE_NAME:-}" ]; then
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --force-new-deployment \
            --region "$AWS_DEFAULT_REGION"
        fi
